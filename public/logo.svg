<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="280" viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Modern Gradients -->
        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#0099ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
        </linearGradient>

        <!-- Splash Gradients -->
        <radialGradient id="splashGradient1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:#00ccff;stop-opacity:0.8"/>
            <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0"/>
        </radialGradient>

        <radialGradient id="splashGradient2" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:#0099ff;stop-opacity:0.6"/>
            <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0"/>
        </radialGradient>

        <!-- Water Reflection Gradient -->
        <linearGradient id="reflectionGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#0099ff;stop-opacity:0.05" />
        </linearGradient>

        <!-- Filters -->
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="2" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Water Reflection Filter -->
        <filter id="waterReflection" x="-50%" y="-50%" width="200%" height="200%">
            <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="3" result="turbulence"/>
            <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="10" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation="1"/>
        </filter>

        <!-- Splash Filter -->
        <filter id="splash" x="-50%" y="-50%" width="200%" height="200%">
            <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.5"/>
            </feComponentTransfer>
        </filter>

        <!-- Small Droplets Filter -->
        <filter id="droplets" x="-50%" y="-50%" width="200%" height="200%">
            <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="2"/>
            <feGaussianBlur stdDeviation="0.5"/>
        </filter>
    </defs>

    <!-- Dynamic Water Splashes -->
    <g class="water-effects">
        <!-- Large Splash Areas -->
        <circle cx="80" cy="100" r="40" fill="url(#splashGradient1)">
            <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="420" cy="80" r="35" fill="url(#splashGradient2)">
            <animate attributeName="r" values="35;40;35" dur="2.5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.5s" repeatCount="indefinite"/>
        </circle>

        <!-- Animated Water Drops -->
        <g class="drops">
            <!-- Left Side Drops -->
            <path d="M70,60 Q75,50 80,60 L75,70 Z" fill="#0099ff" opacity="0.7">
                <animate attributeName="d" 
                         values="M70,60 Q75,50 80,60 L75,70 Z;
                                M70,65 Q75,55 80,65 L75,75 Z;
                                M70,60 Q75,50 80,60 L75,70 Z"
                         dur="2s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
            </path>
            
            <!-- Right Side Drops -->
            <path d="M420,50 Q425,40 430,50 L425,60 Z" fill="#00ccff" opacity="0.6">
                <animate attributeName="d" 
                         values="M420,50 Q425,40 430,50 L425,60 Z;
                                M420,55 Q425,45 430,55 L425,65 Z;
                                M420,50 Q425,40 430,50 L425,60 Z"
                         dur="1.8s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
            </path>

            <!-- Center Drops -->
            <path d="M240,40 Q245,30 250,40 L245,50 Z" fill="#0066cc" opacity="0.5">
                <animate attributeName="d" 
                         values="M240,40 Q245,30 250,40 L245,50 Z;
                                M240,45 Q245,35 250,45 L245,55 Z;
                                M240,40 Q245,30 250,40 L245,50 Z"
                         dur="2.2s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.2s" repeatCount="indefinite"/>
            </path>
        </g>

        <!-- Splash Lines -->
        <g class="splash-lines">
            <path d="M100,90 Q120,70 140,90" stroke="#0099ff" stroke-width="3" fill="none" opacity="0.4">
                <animate attributeName="d" 
                         values="M100,90 Q120,70 140,90;
                                M100,90 Q120,80 140,90;
                                M100,90 Q120,70 140,90"
                         dur="2s" repeatCount="indefinite"/>
            </path>
            <path d="M380,70 Q400,50 420,70" stroke="#00ccff" stroke-width="3" fill="none" opacity="0.4">
                <animate attributeName="d" 
                         values="M380,70 Q400,50 420,70;
                                M380,70 Q400,60 420,70;
                                M380,70 Q400,50 420,70"
                         dur="2.5s" repeatCount="indefinite"/>
            </path>
        </g>
    </g>

    <!-- Main Logo Group -->
    <g transform="translate(40,60)" filter="url(#dropShadow)">
        <!-- Dynamic Wave Pattern -->
        <g class="waves" transform="translate(0,40)">
            <path d="M0,0 C50,-20 100,20 150,0 C200,-20 250,20 300,0 C350,-20 400,20 450,0" 
                  fill="none" 
                  stroke="url(#waveGradient)" 
                  stroke-width="6"
                  stroke-linecap="round">
                <animate attributeName="d" 
                         dur="4s"
                         repeatCount="indefinite"
                         values="M0,0 C50,-20 100,20 150,0 C200,-20 250,20 300,0 C350,-20 400,20 450,0;
                                M0,0 C50,20 100,-20 150,0 C200,20 250,-20 300,0 C350,20 400,-20 450,0;
                                M0,0 C50,-20 100,20 150,0 C200,-20 250,20 300,0 C350,-20 400,20 450,0"
                         calcMode="spline"
                         keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
            </path>
        </g>

        <!-- Main Text -->
        <g class="text" transform="translate(0,0)">
            <text font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" letter-spacing="4">
                <tspan x="0" y="50" font-size="72" fill="url(#textGradient)">WEB</tspan>
                <tspan x="180" y="50" font-size="72" fill="url(#waveGradient)">DARYA</tspan>
            </text>
        </g>

        <!-- Text Reflection -->
        <g class="reflection" transform="translate(0,60) scale(1,-0.5) skewX(5)">
            <text font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" letter-spacing="4" filter="url(#waterReflection)">
                <tspan x="0" y="50" font-size="72" fill="url(#reflectionGradient)">WEB</tspan>
                <tspan x="180" y="50" font-size="72" fill="url(#reflectionGradient)">DARYA</tspan>
            </text>
        </g>

        <!-- Decorative Elements -->
        <g class="decorative">
            <line x1="0" y1="70" x2="450" y2="70" 
                  stroke="url(#waveGradient)" 
                  stroke-width="2" 
                  opacity="0.5"/>
            
            <circle cx="165" cy="50" r="3" fill="url(#waveGradient)"/>
        </g>
    </g>

    <!-- Tagline -->
    <text x="250" y="240" 
          font-family="Arial, sans-serif" 
          font-size="14" 
          fill="#666666" 
          text-anchor="middle" 
          letter-spacing="3">
        WEB DEVELOPMENT AGENCY
    </text>
</svg> 